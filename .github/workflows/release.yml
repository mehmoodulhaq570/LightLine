name: Release

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix, for example 0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-request:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/release '))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Parse release version
        id: version
        shell: bash
        env:
          COMMENT: ${{ github.event.comment.body }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${COMMENT#/release }"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Built once per architecture, each on its own hardware so the tests run
  # natively: x86_64 on the usual runner, ARM64 on GitHub's Windows 11 ARM one.
  build:
    needs: release-request
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            # Kept as plain lightline.exe, the name earlier releases and the
            # README's download link use.
            exe: lightline.exe
          - arch: arm64
            runner: windows-11-arm
            exe: lightline-arm64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The ARM image may come without rustup, which dtolnay/rust-toolchain
      # below needs to install the pinned toolchain.
      - name: Install rustup (ARM64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          if (Get-Command rustup -ErrorAction SilentlyContinue) {
            rustup --version
            return
          }
          $init = Join-Path $env:RUNNER_TEMP "rustup-init.exe"
          Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe" -OutFile $init
          & $init -y --default-toolchain none --profile minimal --no-modify-path
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          Join-Path $cargoHome "bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # ureq's TLS uses ring, which needs clang to build for Windows ARM64.
      - name: Install clang (ARM64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Get-Command clang -ErrorAction SilentlyContinue) -and -not (Test-Path "$llvm\clang.exe")) {
            $installer = Join-Path $env:RUNNER_TEMP "llvm.exe"
            Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-woa64.exe" -OutFile $installer
            Start-Process $installer -ArgumentList "/S" -Wait
          }
          if (Test-Path "$llvm\clang.exe") {
            $llvm | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable as of 2026-10-01
        with:
          toolchain: 1.98.0
          # dtolnay/rust-toolchain only installs what's listed here; unlike
          # the windows-latest image's preinstalled default toolchain, this
          # pinned 1.98.0 install has neither by default, and this workflow
          # needs both below. Keep in step with rust.yml.
          components: rustfmt, clippy

      - name: Verify release tag is unused
        shell: pwsh
        env:
          VERSION: ${{ needs.release-request.outputs.version }}
        run: |
          # Deliberately not "--exit-code": that flag makes git exit 2 (not
          # 0) precisely when the tag is *absent*, and PowerShell 7.3+'s
          # default of auto-throwing on any non-zero native-command exit
          # code turns that ordinary "not found" result into a step
          # failure. Without the flag, ls-remote always exits 0 and we can
          # tell whether the tag exists from its output alone.
          $tag = "v$env:VERSION"
          $existing = git ls-remote --tags origin "refs/tags/$tag" 2>&1
          Write-Host "git ls-remote exit code: $LASTEXITCODE"
          Write-Host "git ls-remote output: $existing"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check for existing tag $tag (git ls-remote exited with code $LASTEXITCODE): $existing"
          }
          if ($existing) {
            throw "Release tag $tag already exists."
          }

      # Formatting is the same on every architecture, so it's checked once.
      - name: Check formatting
        if: matrix.arch == 'x86_64'
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release executable
        env:
          LIGHTLINE_VERSION: ${{ needs.release-request.outputs.version }}
        run: cargo build --release --locked

      # Code signing via SignPath. Disabled until SignPath approves the project:
      # once it does, set the repository variable SIGNPATH_ENABLED to "true" and
      # SIGNPATH_ORGANIZATION_ID, and add the SIGNPATH_API_TOKEN secret.
      - name: Upload unsigned executable
        if: vars.SIGNPATH_ENABLED == 'true'
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: lightline-unsigned-${{ matrix.arch }}
          path: target/release/lightline.exe

      - name: Sign executable with SignPath
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: lightline
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use signed executable
        if: vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "signed/lightline.exe")) {
            throw "SignPath did not return signed/lightline.exe."
          }
          $signature = Get-AuthenticodeSignature "signed/lightline.exe"
          if ($signature.Status -ne "Valid") {
            throw "Signed executable has signature status $($signature.Status)."
          }
          Copy-Item "signed/lightline.exe" "target/release/lightline.exe" -Force

      - name: Package release assets
        shell: pwsh
        env:
          VERSION: ${{ needs.release-request.outputs.version }}
          ARCH: ${{ matrix.arch }}
          EXE: ${{ matrix.exe }}
        run: |
          # Inside the zip the program is always lightline.exe.
          New-Item -ItemType Directory -Force -Path "package", "dist" | Out-Null
          Copy-Item "target/release/lightline.exe" "package/lightline.exe"
          Copy-Item "README.md" "package/README.md"
          Copy-Item "CHANGELOG.md" "package/CHANGELOG.md"
          Compress-Archive -Path "package/*" -DestinationPath "dist/lightline-v$env:VERSION-windows-$env:ARCH.zip" -Force
          Copy-Item "target/release/lightline.exe" "dist/$env:EXE"
          Get-ChildItem dist

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Publishes once both architectures have built and passed their tests.
  publish:
    needs: [release-request, build]
    runs-on: ubuntu-latest
    steps:
      # For the Scoop manifest update at the end.
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: |
          # Written outside dist first, so it never lists itself.
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-request.outputs.version }}
        run: |
          # --target: the tag goes on the commit that was built and tested,
          # even if main has moved on since.
          gh release create "v$VERSION" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "LightLine v$VERSION" \
            --generate-notes

      # This repository is also a Scoop bucket (bucket/lightline.json), so
      # `scoop install lightline` gets the new version. Pre-releases such as
      # 0.3.1-beta.1 are left out. Pushes made with GITHUB_TOKEN don't start
      # other workflows, so this commit doesn't trigger the Rust check.
      - name: Update the Scoop manifest
        if: ${{ !contains(needs.release-request.outputs.version, '-') }}
        env:
          VERSION: ${{ needs.release-request.outputs.version }}
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/v$VERSION"
          x64_hash=$(awk '$2 ~ /-windows-x86_64\.zip$/ { print $1 }' dist/SHA256SUMS.txt)
          arm64_hash=$(awk '$2 ~ /-windows-arm64\.zip$/ { print $1 }' dist/SHA256SUMS.txt)
          if [ -z "$x64_hash" ] || [ -z "$arm64_hash" ]; then
            echo "Missing a zip hash in SHA256SUMS.txt"
            exit 1
          fi
          jq --indent 4 \
            --arg version "$VERSION" \
            --arg x64_url "$base/lightline-v$VERSION-windows-x86_64.zip" \
            --arg x64_hash "$x64_hash" \
            --arg arm64_url "$base/lightline-v$VERSION-windows-arm64.zip" \
            --arg arm64_hash "$arm64_hash" \
            '.version = $version
             | .architecture = {
                 "64bit": { url: $x64_url, hash: $x64_hash },
                 "arm64": { url: $arm64_url, hash: $arm64_hash }
               }' \
            bucket/lightline.json > lightline.json.new
          mv lightline.json.new bucket/lightline.json
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/lightline.json
          git commit -m "chore(scoop): update LightLine to $VERSION"
          git push origin HEAD:main
