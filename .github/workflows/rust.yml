name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # x86_64 and ARM64, each on its own hardware, so an ARM64 problem shows
    # up here rather than in the middle of a release.
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # The ARM image may come without rustup; the x86_64 one has it
      # preinstalled.
      - name: Install rustup (ARM64)
        if: runner.arch == 'ARM64'
        shell: pwsh
        run: |
          if (Get-Command rustup -ErrorAction SilentlyContinue) {
            rustup --version
            return
          }
          $init = Join-Path $env:RUNNER_TEMP "rustup-init.exe"
          Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe" -OutFile $init
          & $init -y --default-toolchain none --profile minimal --no-modify-path
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          Join-Path $cargoHome "bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # Pinned to the same version as release.yml, so a new stable release
      # cannot fail PR checks with lints the code has not been updated for.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy

      # ureq's TLS uses ring, which needs clang to build for Windows ARM64.
      - name: Install clang (ARM64)
        if: runner.arch == 'ARM64'
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Get-Command clang -ErrorAction SilentlyContinue) -and -not (Test-Path "$llvm\clang.exe")) {
            $installer = Join-Path $env:RUNNER_TEMP "llvm.exe"
            Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-woa64.exe" -OutFile $installer
            Start-Process $installer -ArgumentList "/S" -Wait
          }
          if (Test-Path "$llvm\clang.exe") {
            $llvm | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
