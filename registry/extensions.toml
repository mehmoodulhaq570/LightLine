# LightLine's own extension list: extensions tested with LightLine.
#
# The Extensions panel shows these first, with a "LightLine" badge, and
# recommends the ones marked `recommended`. A copy is built into LightLine,
# and the panel also reads this file from GitHub when it opens, so a new
# entry reaches users without waiting for a release.
#
# Propose an entry with a pull request: CONTRIBUTING.md says what's checked.
# `cargo test --lib lightline_list` checks this file; run
# `cargo test --lib lightline_list -- --ignored` to install every entry.
#
# Each [[extension]] is one of:
#   from = "zed"           a Zed registry extension, installed at the commit
#                          Zed's registry pins (it updates when Zed's does)
#   repository + commit    an extension in its own GitHub repository, in
#   + version              Zed's format, installed at exactly this commit;
#   (+ path)               with a path, that folder of the repository is the
#                          extension and only it is downloaded
#   builtin = true         part of LightLine itself (Prettier)
#
# LightLine's own extensions live in one repository,
# github.com/mehmoodulhaq570/lightline-extensions, each in its own folder.
#
# kind: color-theme, icon-theme, language, snippets, checker or formatter.
# requires = "0.13.0" hides an entry from older LightLine releases (needed for
# a path: older ones don't know it).

format = 1

[[extension]]
id = "lightline-themes"
repository = "https://github.com/mehmoodulhaq570/lightline-extensions.git"
path = "themes/lightline-themes"
commit = "5a88eac2bf36e295cdfcab2c0bc714f30b4d5bdd"
version = "1.0.0"
kind = "color-theme"
name = "LightLine Themes"
description = "Daylight and Contrast, made to match Midnight"
publisher = "LightLine"
recommended = true
requires = "0.13.0"

[[extension]]
id = "lightline-c-snippets"
repository = "https://github.com/mehmoodulhaq570/lightline-extensions.git"
path = "snippets/lightline-c-snippets"
